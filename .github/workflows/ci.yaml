name: Continuous Integration

on:
  push:
    branches: [ master ]
    tags: [ '*' ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ windows-latest, ubuntu-latest ]
    runs-on: ${{ matrix.os }}

    steps:
    - name: Check out
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-${{ runner.os }}-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
        restore-keys: nuget-${{ runner.os }}-

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --logger "trx;LogFilePrefix=test-results"

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: success() || failure()
      with:
        name: test-results-${{ runner.os }}
        path: tests/NGuid.Tests/TestResults/*.trx

    - name: Pack
      if: runner.os == 'Windows'
      run: dotnet pack --configuration Release --no-build

    - name: Upload NuGet Package
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: artifacts/package/release/
        if-no-files-found: error

  native-aot:
    strategy:
      fail-fast: false
      matrix:
        tfm: [ net8.0, net10.0 ]
    runs-on: ubuntu-latest

    steps:
    - name: Check out
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        global-json-file: global.json

    - name: Cache NuGet packages
      uses: actions/cache@v6
      with:
        path: ~/.nuget/packages
        key: nuget-aot-${{ hashFiles('Directory.Packages.props', '**/*.csproj') }}
        restore-keys: nuget-aot-

    - name: Publish
      run: dotnet publish tests/NGuid.NativeAot.Tests --configuration Release --runtime linux-x64 --framework ${{ matrix.tfm }}

    - name: Test Native AOT
      run: ./artifacts/publish/NGuid.NativeAot.Tests/release_${{ matrix.tfm }}_linux-x64/NGuid.NativeAot.Tests
