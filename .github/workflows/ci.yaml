name: Continuous Integration

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Check out
      uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: |
          8.0.x
          9.0.x
        global-json-file: global.json

    - name: Restore
      run: dotnet restore

    - name: Build
      run: dotnet build --configuration Release --no-restore

    - name: Test
      run: dotnet test --configuration Release --no-build --logger "trx;LogFilePrefix=test-results"

    - name: Upload Test Results
      uses: actions/upload-artifact@v7
      if: success() || failure()
      with:
        name: test-results
        path: tests/NGuid.Tests/TestResults/*.trx

    - name: Pack
      run: dotnet pack --configuration Release --no-build

    - name: Upload NuGet Package
      uses: actions/upload-artifact@v7
      with:
        name: nuget
        path: artifacts/package/release/
        if-no-files-found: error
